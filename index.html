<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
 <!-- CSS link -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
  <div class="star"> <img src="/images/icon-star.svg" alt=""></div>
<!-- Rating state start -->
<div class="text">
 <h1 class="header"> How did we do?</h1>

  <p class="paragraph">
    Please let us know how we did with your support request. All feedback is appreciated 
  to help us improve our offering!
</p>
</div>
  
<div class="button-numbers"> <button class="numbers">1</button> <button class="numbers">2</button> <button class="numbers">3</button> <button class="numbers">4</button> <button class="numbers">5</button> </div>
<div class="sub-button"><button class="submit" disabled>SUBMIT</button></div>
 

  





  
</div>
  <!-- Rating state end -->

  <!-- Thank you state start -->
<div class="sec-container">
<div class="illustration"><img class="image"  src="/images/illustration-thank-you.svg" alt=""></div>
<div class="sec-button"><p class="but-2">You selected x out of 5</p></div>

<div class="sec-text">
<h1>Thank you!</h1>
<p>We appreciate you taking the time to give a rating. If you ever need more support, 
  don't hesitate to get in touch!</p>
</div>
  

  
</div>
  

  <!-- Thank you state end -->
   
  <!-- linked js file -->
  <script src="index.js"></script>
</body>
</html>
